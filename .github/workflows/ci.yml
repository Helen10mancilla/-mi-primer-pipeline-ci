
name: Pipeline de Integracion Continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verificar sintaxis
        run: python -m compileall -q .

      - name: Ejecutar pruebas y generar reporte
        run: |
          mkdir -p reportes
          python -m pytest -v --junitxml=reportes/pruebas.xml

      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-de-pruebas
          path: reportes/pruebas.xml
          if-no-files-found: ignore

  publish:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    needs: test

    # Publicar solo cuando hay un push a main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/helen10mancilla/calculadora-cd
          tags: |
            type=sha
            type=raw,value=latest

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

         
    
  
    
       
      
      
